# core-workflow — Role Configuration
# Defines available roles, their harness mapping, and identity pools.

roles:
  - name: "PM"
    file: "references/roles/pm.md"
    default_harness: "claude"
    permission: "approve-all"

  - name: "Architect"
    file: "references/roles/architect.md"
    default_harness: "claude"
    permission: "approve-reads"

  - name: "Developer"
    file: "references/roles/dev.md"
    default_harness: "codex"
    permission: "approve-all"

  - name: "Reviewer"
    file: "references/roles/reviewer.md"
    default_harness: "codex"
    permission: "approve-reads"

  - name: "Tester"
    file: "references/roles/tester.md"
    default_harness: "codex"
    permission: "approve-all"

  - name: "Scrum Master"
    file: "references/roles/scrum.md"
    default_harness: "claude"
    permission: "approve-reads"

  - name: "Designer"
    file: "references/roles/designer.md"
    default_harness: "claude"
    permission: "approve-reads"

# Identity pools — each role picks an unused name from its pool
identities:
  PM: ["Plato", "Park", "Parker"]
  Architect: ["Ada", "Archie", "Alba"]
  Developer: ["Leo", "Dante", "Devlin"]
  Reviewer: ["Remy", "Rex", "Rita"]
  Tester: ["Tess", "Tobi", "Tara"]
  Scrum Master: ["Sam", "Scout", "Skye"]
  Designer: ["Dali", "Dia", "Dex"]
