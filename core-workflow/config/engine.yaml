# core-workflow — Engine Configuration
# Central config for the workflow orchestrator.
# Consumed by: skill/core-workflow/SKILL.md, scripts/engine.mjs

# ACP sub-agent capability
acp_available: false          # Auto-detected; override if needed
acp_default_mode: "auto"     # "auto" | "always" | "never"

# Chain protocol settings
chain_protocol:
  auto_chain: true            # Auto-chain after every action
  decision_point_threshold: 2 # Minimum alternatives to show a menu
  loop_detection: true        # Prevent identical next_action

# Test enforcement
test_enforcement:
  require_execution: true     # No "assumed" test results
  e2e_blocker_on_unit_fail: true
  test_artifact_required: true

# Status file paths (relative to project cwd)
status:
  yaml_path: "bmad/status.yaml"
  md_path: "bmad/status.md"

# Logging
log:
  level: "info"              # "debug" | "info" | "warn" | "error"
  openspace_path: "bmad/bmad-openspace.md"
